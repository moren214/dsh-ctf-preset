name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install venv support（Ubuntu 的 python3 默认不带 venv 模块）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv
      - name: Check every module and local import
        run: npm run check
      - name: Unit tests with coverage floor
        shell: bash
        id: suite
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee test-output.txt
      - name: Turn failures into annotations
        if: steps.suite.outcome == 'failure'
        shell: bash
        run: node scripts/ci-annotate.mjs test-output.txt
      - name: Propagate the suite result
        if: steps.suite.outcome == 'failure'
        run: exit 1

  python-workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile every Python worker
        run: >-
          python -m py_compile
          archive-directory-worker.py
          compressed-stream-worker.py
          flask-route-worker.py
          media-reader-worker.py
          rev-disasm-worker.py
          workbench-base100-worker.py

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the base sandbox image（跳过 radare2 以控制 CI 时长）
        run: docker build --build-arg WITH_R2=0 -t dsh-ctf-sandbox:ci docker/
      - name: Assert the isolation defaults hold in a real container
        run: |
          set -eu
          # 与 sandbox-runner.js 的 buildDockerArgs 保持同一组加固参数：只读 rootfs +
          # 独立 tmpfs + 全量摘帽 + 禁提权 + pids/内存上限。少了 --tmpfs，/tmp 会跟着
          # rootfs 一起只读，断言会以「镜像有问题」的样子失败（实际是断言写错了）。
          HARDEN="--read-only --network none --tmpfs /tmp:rw,nosuid,size=512m --cap-drop=ALL --security-opt=no-new-privileges:true --pids-limit=256 --memory=2g --memory-swap=2g"
          docker run --rm $HARDEN dsh-ctf-sandbox:ci id | tee /tmp/id.txt
          grep -q 'uid=10001' /tmp/id.txt
          docker run --rm $HARDEN dsh-ctf-sandbox:ci sh -c 'touch /ci-rootfs-write 2>/dev/null && exit 1 || echo rootfs-read-only'
          docker run --rm $HARDEN dsh-ctf-sandbox:ci sh -c 'touch /tmp/ci-ok && echo tmpfs-writable'
          docker run --rm $HARDEN dsh-ctf-sandbox:ci sh -c 'grep -qE "CapEff:[[:space:]]*0000000000000000" /proc/self/status && echo caps-dropped'
          docker run --rm $HARDEN dsh-ctf-sandbox:ci sh -c 'grep -qE "NoNewPrivs:[[:space:]]*1" /proc/self/status && echo no-new-privs'
